# Minimal proxy for reaching site hosts through the tunnel.
# Only Docker's private ranges may connect — the port is never published to
# the host, so this is reachable from sibling containers and nowhere else.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Info
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16
DisableViaHeader Yes
