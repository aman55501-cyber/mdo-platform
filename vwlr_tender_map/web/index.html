<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tender map for Vedanta Washery & Logistic Solutions (VWLR, Kharsia).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VWLR Tender Map">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VWLR Tender Map</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for google_maps_flutter on the web.
       Replace PASTE_YOUR_GOOGLE_MAPS_ANDROID_KEY with a browser key that has
       "Maps JavaScript API" enabled (a separate key from the Android one is
       fine). Without a valid key the map tile stays blank but the rest of the
       app — list, dashboard, tender detail, eligibility — works normally. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=PASTE_YOUR_GOOGLE_MAPS_ANDROID_KEY"></script>
</head>
<body>
  <!--
    Build with `flutter build web --no-web-resources-cdn` to bundle CanvasKit
    under canvaskit/ and load it from the app's own origin instead of the
    gstatic.com CDN — so the app is self-contained on locked-down/offline hosts.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
