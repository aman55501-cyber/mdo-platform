# MDO Platform — one stack, one VPS (Hostinger KVM or any Docker host).
#
# This file merges what used to be two separate deployments:
#   • MDO      — the operating surface (backend + Next.js app + WhatsApp + VPN sidecars)
#   • Shares CFO — the capital surface (live broker sessions, execution, analysis)
#
# Because both now live on the same compose network, the MDO backend reaches
# Shares CFO directly at http://sharescfo:8000. The old cross-stack hack
# (`docker network connect sharecfo_default mdo-platform-backend-1`) is gone.
#
#   cp .env.example .env   → set NEXT_PUBLIC_API_URL, DOMAIN + API keys
#   docker compose up -d --build
#
# Frontend → http://<VPS_IP>:3000   Backend → http://<VPS_IP>:8501
# Shares CFO → https://$DOMAIN (via Caddy, automatic Let's Encrypt cert)
# SQLite lives in the named volume `mdo-data` — survives rebuilds/redeploys.

services:
  # ── MDO backend ─────────────────────────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      VEGA_DB_PATH: /data/vega_data.db
      VEDANTA_DB_PATH: /data/vedanta_crm.db
      WA_BRIDGE_URL: http://whatsapp:3001
      WA_BRIDGE2_URL: http://whatsapp2:3001
      # Capital bridge — the Shares CFO service below, same network, same stack.
      CFO_API_URL: ${CFO_API_URL:-http://sharescfo:8000}
      CFO_API_TOKEN: ${CFO_API_TOKEN:-}
      # Site networks reached through the VPN sidecars (see vpn/Dockerfile).
      HOTEL_PROXY_URL: ${HOTEL_PROXY_URL:-http://vpn-hotel:8888}
      VEDANTA_PROXY_URL: ${VEDANTA_PROXY_URL:-http://vpn-vedanta:8888}
      TZ: Asia/Kolkata
    volumes:
      - mdo-data:/data
    depends_on:
      - sharescfo

  # ── Shares CFO — capital surface ────────────────────────────────────────
  # Live broker sessions (HDFC1/HDFC2/Angel), execution engine, analysis stack.
  # Read by the MDO backend through CFO_API_URL / CFO_API_TOKEN.
  sharescfo:
    build:
      context: .
      dockerfile: Dockerfile.sharescfo
    restart: unless-stopped
    labels:
      - "autoheal=true"        # autoheal restarts this container if it turns unhealthy
    healthcheck:
      # liveness only (no auth, no data) — if the app wedges, this fails and autoheal restarts it
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    environment:
      - PORT=8000
      - TZ=Asia/Kolkata
    env_file:
      - .env
    ports:
      # Published so the Shares CFO terminal UI stays reachable directly. Its pages
      # link to absolute paths (/portfolio, /accounts, …), which would collide with
      # the MDO app if it were nested under a path prefix on the shared hostname.
      - "8000:8000"
    volumes:
      # persist snapshots + audit log across rebuilds (sector map stays baked in image)
      - sharescfo_state:/app/shares_cfo/data/state
      # persist uploaded Screener Premium exports across rebuilds
      - sharescfo_screener:/app/shares_cfo/data/screener
      # persist uploaded MProfit exports across rebuilds
      - sharescfo_mprofit:/app/shares_cfo/data/mprofit

  # ── WhatsApp ops-groups bridge ──────────────────────────────────────────
  # Baileys — no Chromium. After `up`, open the app's VWLR Ops Feed page and
  # scan the QR once; session persists in wa-auth.
  whatsapp:
    build: ./whatsapp_bridge
    restart: unless-stopped
    environment:
      MDO_BACKEND_URL: http://backend:8501
      AUTH_DIR: /data/wa_auth
      TZ: Asia/Kolkata
      MDO_AUTH_TOKEN: ${MDO_AUTH_TOKEN:-}
    volumes:
      - wa-auth:/data
    depends_on:
      - backend

  # Second WhatsApp account (e.g. the hotel phone). Same bridge image, its own
  # session volume. Scan its QR from the Ops Feed page → "Phone 2".
  whatsapp2:
    build: ./whatsapp_bridge
    restart: unless-stopped
    environment:
      MDO_BACKEND_URL: http://backend:8501
      AUTH_DIR: /data/wa_auth
      TZ: Asia/Kolkata
      MDO_AUTH_TOKEN: ${MDO_AUTH_TOKEN:-}
    volumes:
      - wa-auth2:/data
    depends_on:
      - backend

  # ── Site VPN sidecars ───────────────────────────────────────────────────
  # One container per site: OpenVPN client + HTTP proxy on :8888 (never
  # published to the host). The tunnel is confined to the container's network
  # namespace, so the VPS host routing table is untouched and a bad route push
  # cannot cost you SSH or the website. Rollback is `docker compose stop`.
  vpn-hotel:
    build: ./vpn
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/hotel/client.ovpn:/etc/openvpn/client.ovpn:ro
    environment:
      TZ: Asia/Kolkata
      # The hotel runs IDS Next FortuneNext — a SQL Server app, so its data is on
      # 1433 rather than behind an HTTP endpoint. Format: listen:host:port, comma
      # separated. Fill in the real LAN address after the discovery scan.
      #   HOTEL_TCP_FORWARDS=1433:10.0.0.5:1433
      TCP_FORWARDS: ${HOTEL_TCP_FORWARDS:-}

  vpn-vedanta:
    build: ./vpn
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/vedanta/client.ovpn:/etc/openvpn/client.ovpn:ro
    environment:
      TZ: Asia/Kolkata
      TCP_FORWARDS: ${VEDANTA_TCP_FORWARDS:-}

  # ── MDO frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./mdo-app
      args:
        # Set in .env — the URL the BROWSER reaches the backend on
        # (http://<VPS_IP>:8501 or https://api.yourdomain.com)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8501}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Edge: TLS + routing ─────────────────────────────────────────────────
  # Caddy terminates TLS and fetches/renews free Let's Encrypt certs. See
  # Caddyfile for which hostname maps to which service.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - MDO_DOMAIN=${MDO_DOMAIN:-mdo.localhost}
      - MDO_API_DOMAIN=${MDO_API_DOMAIN:-api.localhost}
      - CFO_DOMAIN=${CFO_DOMAIN:-cfo.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sharescfo
      - frontend
      - backend

  # Watches healthchecks and restarts any container labeled autoheal=true if it
  # goes unhealthy (a hung app that never crashes). Completes the "never offline" story.
  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mdo-data:
  wa-auth:
  wa-auth2:
  caddy_data:
  caddy_config:
  sharescfo_state:
  sharescfo_screener:
  sharescfo_mprofit:
