# Shares CFO — VPS deployment with automatic HTTPS.
# Caddy terminates TLS (free Let's Encrypt cert for $DOMAIN) and proxies to the
# read-only app. Run from the repo root on your VPS:  docker compose up -d
#
# Requires a .env file next to this (gitignored) containing at least:
#   DOMAIN=yourname.duckdns.org
#   HDFC_HDFC1_API_KEY=...
#   HDFC_HDFC1_API_SECRET=...
#   HDFC_BASE_URL=https://developer.hdfcsec.com/oapi/v1
#   CFO_API_TOKEN=<long random string>
#   CFO_ACCOUNTS=HDFC1

services:
  sharescfo:
    build:
      context: .
      dockerfile: Dockerfile.sharescfo
    restart: always
    labels:
      - "autoheal=true"        # autoheal restarts this container if it turns unhealthy
    healthcheck:
      # liveness only (no auth, no data) — if the app wedges, this fails and autoheal restarts it
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    environment:
      - PORT=8000
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      # persist snapshots + audit log across rebuilds (sector map stays baked in image)
      - sharescfo_state:/app/shares_cfo/data/state
      # persist uploaded Screener Premium exports across rebuilds
      - sharescfo_screener:/app/shares_cfo/data/screener
      # persist uploaded MProfit exports across rebuilds
      - sharescfo_mprofit:/app/shares_cfo/data/mprofit

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sharescfo

  # Watches healthchecks and restarts any container labeled autoheal=true if it
  # goes unhealthy (a hung app that never crashes). Completes the "never offline" story.
  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  caddy_data:
  caddy_config:
  sharescfo_state:
  sharescfo_screener:
  sharescfo_mprofit:
