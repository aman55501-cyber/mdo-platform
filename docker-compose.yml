# MDO Platform — single-VPS deployment (Hostinger KVM or any Docker host)
#
#   cp .env.example .env   → set NEXT_PUBLIC_API_URL + API keys
#   docker compose up -d --build
#
# Frontend → http://<VPS_IP>:3000   Backend → http://<VPS_IP>:8501
# SQLite lives in the named volume `mdo-data` — survives rebuilds/redeploys.

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      VEGA_DB_PATH: /data/vega_data.db
      VEDANTA_DB_PATH: /data/vedanta_crm.db
      WA_BRIDGE_URL: http://whatsapp:3001
      WA_BRIDGE2_URL: http://whatsapp2:3001
      # sharecfo bridge — live broker sessions for all 4 accounts. Requires the
      # backend container to share a network with sharecfo:
      #   docker network connect sharecfo_default mdo-platform-backend-1
      CFO_API_URL: ${CFO_API_URL:-http://sharescfo:8000}
      CFO_API_TOKEN: ${CFO_API_TOKEN:-}
      TZ: Asia/Kolkata
    volumes:
      - mdo-data:/data

  # WhatsApp ops-groups bridge (Baileys — no Chromium). After `up`, open the
  # app's VWLR Ops Feed page and scan the QR once; session persists in wa-auth.
  whatsapp:
    build: ./whatsapp_bridge
    restart: unless-stopped
    environment:
      MDO_BACKEND_URL: http://backend:8501
      AUTH_DIR: /data/wa_auth
      TZ: Asia/Kolkata
      MDO_AUTH_TOKEN: ${MDO_AUTH_TOKEN:-}
    volumes:
      - wa-auth:/data
    depends_on:
      - backend

  # Second WhatsApp account (e.g. the hotel phone). Same bridge image, its own
  # session volume. Scan its QR from the Ops Feed page → "Phone 2".
  whatsapp2:
    build: ./whatsapp_bridge
    restart: unless-stopped
    environment:
      MDO_BACKEND_URL: http://backend:8501
      AUTH_DIR: /data/wa_auth
      TZ: Asia/Kolkata
      MDO_AUTH_TOKEN: ${MDO_AUTH_TOKEN:-}
    volumes:
      - wa-auth2:/data
    depends_on:
      - backend

  frontend:
    build:
      context: ./mdo-app
      args:
        # Set in .env — the URL the BROWSER reaches the backend on
        # (http://<VPS_IP>:8501 or https://api.yourdomain.com)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8501}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mdo-data:
  wa-auth:
  wa-auth2:
