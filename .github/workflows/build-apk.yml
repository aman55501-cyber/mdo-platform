name: Build VWLR Tender Map APK

# Builds the release APK and publishes it to a GitHub Release so it can be
# downloaded and installed on an Android phone (no Play Store needed).
# Download from: repo → Releases → "app-latest" → app-release.apk

on:
  push:
    branches:
      - claude/vwlr-tender-map-flutter-ah6zxy
      - main
    paths:
      - 'vwlr_tender_map/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vwlr_tender_map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s|PASTE_YOUR_GOOGLE_MAPS_ANDROID_KEY|$MAPS_API_KEY|g" \
              android/app/src/main/AndroidManifest.xml lib/config.dart
            echo "Google Maps key injected — Map tab will render a live map."
          else
            echo "No MAPS_API_KEY secret set — building with the map placeholder card."
          fi
      - name: Build release APK
        run: flutter build apk --release
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: VWLR Tender Map (latest)
          body: |
            Latest Android build of VWLR Tender Map.
            Download **app-release.apk** below and install on your phone
            (enable "Install unknown apps" for your browser when prompted).
          files: vwlr_tender_map/build/app/outputs/flutter-apk/app-release.apk

# retrigger build (previous run got no runner and auto-cancelled)
