- id: voice
  name: Voice notes — WhatsApp audio transcribed on the VPS (faster-whisper, no API)
  runs_on: vps-cron
  provider: none
  command: docker compose exec -T backend python mdo_agent.py voice
  cadence: every 10 min 07:00-22:00 IST
  model: none
  heartbeat: 'every run, also when nothing is pending: "voice: N transcribed, P pending, F failed, model small, avg
    Xs/clip"; "voice: faster-whisper not installed — nothing transcribed" (a warning, exit 0) when the library is
    missing from the image; "model small failed to load: <reason>" as an error line, never a crash'
  checks: []
  serves:
  - vwlr-dispatch
  - capital-rules
  enabled: true
  objective: every voice note in a watched chat (the Mausaji calls, the site groups) is text within ten minutes, so
    wa-sweep and wa-intel read it like a typed message and nothing said by voice is missed
  notes: 'Built 2026-10-09 on the CoS brief. Bridges v2.2 (whatsapp_bridge/index.js): audioMessage / ptt of every
    chat they forward as text (groups and DMs — the backend''s personal-chat gate decides what is kept) is
    downloaded with Baileys downloadMediaMessage and POSTed as multipart to /api/wa/media (same X-MDO-Key):
    account, chat_jid, chat_name, sender, message_id, mimetype, duration_seconds, file; live messages only, never
    the history backfill; clips over WA_AUDIO_MAX_BYTES (16 MB) are skipped; WA_AUDIO_FORWARD=0 switches it off.
    Backend: voice/<date>/<message_id>.ogg under the data volume, row wa_media (message_id UNIQUE, status pending
    → done | failed). Transcription: faster-whisper (CTranslate2, CPU, int8), VOICE_MODEL=small (base if the VPS
    is slow), language auto (Hindi/English mix), model files cached in /data/whisper-models so a rebuild does not
    re-download (~460 MB once). Dashboard: Morning page card "Voice notes", the last 20 transcripts with chat and
    sender (GET /api/wa/media/stats).'
  charter:
    purpose: What is said in a voice note in the Mausaji chat or a site group reaches the sweep and the intel bots
      as text, on the VPS, with no API and no per-minute cost.
    thinks: 'No model of its own, no judgement: the clip becomes text, the text becomes a message. Pending rows are
      taken oldest first, at most VOICE_MAX_PER_RUN (20) per run, inside VOICE_BUDGET_S (480 s); a clip that fails
      to decode is marked failed with the reason and not retried blindly; an empty transcript is "no speech
      detected", nothing is written to the chat for it.'
    works: 'cron 30-59/10 1, */10 2-15, 0-30/10 16 UTC (every 10 min, 07:00–22:00 IST): POST /api/wa/media/transcribe
      → load WhisperModel(VOICE_MODEL, cpu, int8) once per run → for each pending row transcribe(language=None,
      beam_size=1, vad_filter=True) → the transcript into whatsapp_messages through mdo_wa_intel ingest as
      "[voice transcript] <text>", same chat / sender / timestamp, wa_msg_id "<message_id>:voice", voice=1 — the
      text row the bridge already sent for the clip says "[voice note Ns]". Endpoints: POST /api/wa/media (the
      bridge), GET /api/wa/media/stats, GET /api/wa/media/recent?limit=20&status=…'
    limits: Transcribes only what the bridges forward and the gate keeps (a personal chat stores nothing, not even
      the file). Whisper small on a CPU VPS runs at roughly real time to 3× real time per clip; a long clip can
      overrun the budget once and the rest wait ten minutes. Hinglish is transcribed as heard — names, tickers and
      numbers can come out wrong, and the sweep''s word rules read the transcript literally. No speaker diarisation.
    minimum_output: 'Every run: the heartbeat line with counts, including "0 transcribed, 0 pending, 0 failed".
      The not-installed line when faster-whisper is missing. A run with no heartbeat is a dead run.'
    rules:
    - No API, no LLM call, ever — faster-whisper on the VPS CPU only (Directive 15)
    - Never invents or edits a transcript; what Whisper did not hear is not written
    - A personal chat stores nothing — the gate runs before the file is written
    - One transcript row per clip (dedupe key <message_id>:voice), oldest first, time-boxed
    - Every run reports, especially an empty one (Directive 5)
