# fleet.yaml — every bot that exists, and why. Owner of all of them: the Chief of Staff.
# A bot with no `serves:` objective in agenda.yaml is paused at its next slot (CHIEF_OF_STAFF.md §1.8).
# Model IDs are exact strings for the Anthropic API. Change here, not in code.

cos:
  name: Chief of Staff
  runs_on: claude-code-routine
  cadence: daily 06:22 IST + on demand
  model: claude-fable-5-1
  reports_via: POST /api/agent/report cadence=cos
  command: Claude Code Routine 'Chief of Staff morning run' — CRON_TZ=Asia/Kolkata 22 6 * * * (fresh cloud session
    each fire)
  reads:
  - Objectives sheet (Claude Doc)
  - agenda.yaml
  - fleet.yaml
  - /api/agent/reports
  - /api/checks
  - /api/intel
  - /api/ops/tasks
  - /api/capital/summary
  - gmail
  - calendar
  enabled: true
  charter:
    purpose: Single point of contact. Turns Aman's confirmed objectives into jobs, hands them to bots, audits every
      heartbeat, comes back with one line per event and a morning roll-up.
    thinks: Reads the Objectives sheet first, then the ledger. What is confirmed, what moved, what is blocked, who
      is dead, what needs Aman. Proposes; never decides for him.
    works: 'Fresh cloud session daily 06:22 IST (Routine) + on demand via WhatsApp/app/MCP. Model claude-fable-5-1.
      Reads: sheet, agenda, fleet, /api/* ledger, Gmail + Calendar when attached. Writes: agenda mirror, jobs, intel,
      drafts (never sends), repo fixes.'
    limits: Cannot touch VPS cron (files a stuck job instead). Cannot read the sheet without the Claude Docs connector
      on the Routine. Holds no broker, bank, or signing credential. Never sends email.
    minimum_output: 'Every run: the roll-up (even all zeros), a COS_LOG.md line pushed, one job per item that needs
      Aman. A run with no roll-up is a dead run.'
    rules:
    - Objectives are Aman's alone
    - 'No assumed decisions: options + one recommendation, then wait'
    - No unasked tasks
    - Money · sign · regulator = click
    - Never send email
    - Every fact has a source or is marked UNVERIFIED
    - ETA on every job when estimable
    - Completion time stated before any task over 5 minutes
bots:
- id: ops-hourly
  name: Ops hourly watcher (WhatsApp groups + photos)
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py hourly
  cadence: hourly
  model: claude-sonnet-5-5
  checks:
  - dispatch_rakes
  - tender_watch
  - mkt_pulse
  - acct_positions
  - fo_update
  heartbeat: every run posts a one-line report even when clean
  serves:
  - vwlr-dispatch
  - tenders-washing-rcr
  enabled: false   # paused by Aman 2026-10-09 — only levels-alert + capital-watcher run
  charter:
    purpose: 'Catch a site problem inside the hour: rakes idle, a loader/excavator/tipper idle while work waits,
      a machine down, safety, payment failure, a tender closing inside 72h, a day''s dispatch under the 15,000
      MT/day minimum.'
    thinks: 'Default answer is NOTHING. Only a threshold breach is a finding. Idle-equipment watch: any loader,
      excavator or tipper idle while rakes or stock are waiting = finding. Breakdown watch: a machine down >30
      min = 🔴. Dispatch target 15,000 MT/day minimum: the day''s MT below target, seen by 10:00 IST the next
      day = finding. Manpower shortfall against the work on hand = finding. (Aman, chat 2026-10-09.) Chit-chat,
      greetings, context-free photos and anything already reported are ignored.'
    works: 'Hourly on the VPS. Model claude-sonnet-5-5 (Haiku at 90% budget). Reads the last ~120 WhatsApp group
      messages + photo extractions, open intel, recent reports, agenda. The fleet it watches includes the new
      EV loader-4 (Aman, chat 2026-10-09).'
    limits: Sees only what the groups say; no weighbridge or ERP feed, so MT/day comes from the dispatch messages
      and cites them. Tender247 is manual, so tender_watch is public portals only. Cannot act, only report.
    minimum_output: 'A heartbeat every hour: ''clean — N checks ran'' or the finding. Only 🔴 reaches the phone between
      roll-ups.'
    rules:
    - Never invent a number
    - Blocked check = report the gap
    - What changed → why it matters → action + owner + ETA
    - 'Idle equipment while work exists = finding; machine down >30 min = 🔴; day under 15,000 MT = finding; manpower
      short = finding (Aman, chat 2026-10-09)'
- id: daily-brief
  name: Daily brief
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py daily
  cadence: daily 06:57 IST
  model: claude-sonnet-5-5
  checks:
  - dispatch_trend
  - market_close
  - compliance_due
  - projects_update
  - bank_balances
  serves:
  - vwlr-dispatch
  enabled: false   # paused by Aman 2026-10-09 — only levels-alert + capital-watcher run
  charter:
    purpose: 'The morning picture, led by yesterday''s dispatch in MT against the 15,000 MT/day minimum and equipment
      availability (Aman, chat 2026-10-09); then rakes, project progress, compliance due, decisions needed today.'
    thinks: 'First line: yesterday''s MT vs 15,000 — met or short, by how much, cited to the dispatch messages.
      Second: equipment availability — what ran, what was down and for how long, anything idle while work waited
      (EV loader-4 is in the fleet). Then yesterday vs trailing week vs month. Trend, not incident. Staleness is
      flagged, never silently trusted.'
    works: Daily 06:57 IST on the VPS. Model claude-sonnet-5-5. Reads ~300 group messages, filings, open tasks,
      pools, entities.
    limits: 'bank_balances has no feed and is reported as a gap every day until one exists. Seeded compliance dates
      are from April 2026 and may be stale. Hotel occupancy/sales are no longer reported (Aman, chat 2026-10-09):
      the hotel_daily check was dropped from this bot.'
    minimum_output: Always files a report, even 'nothing changed'. Summary 2–4 lines, MT vs 15,000 first, findings
      with level, owner, ETA.
    rules:
    - Never invent
    - Flag stale seeds
    - Lakh/crore
    - Lead with yesterday's MT vs 15,000 and equipment availability (Aman, chat 2026-10-09)
- id: tender-go-no-go
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py tender-go-no-go
  cadence: daily 08:00 IST
  model: claude-opus-5-5
  checks:
  - tender_watch
  skill: skills/tender-go-no-go.md
  serves:
  - tenders-washing-rcr
  enabled: false   # paused by Aman 2026-10-09 — only levels-alert + capital-watcher run
  charter:
    purpose: 'Win ONE coal washing contract and ONE RCR contract with an upfront profit margin good enough that no
      cuts are needed elsewhere. Everything else is secondary (Aman, chat 2026-10-09). For every coal-washing or
      RCR tender: margin first, then eligible or not, closing date, decision deadline, go/no-go with reason.'
    thinks: 'Only coal washing and RCR contracts matter. Evaluate the margin FIRST — bid-calculator inputs sourced,
      never invented — then eligibility from Aman''s criteria in the agenda, not from memory. Every other tender
      is listed in one line and not analysed. A qualifying coal-washing or RCR tender is 🔴 the hour it appears;
      one closing inside 72h with no decision is 🔴.'
    works: Daily 08:00 IST. Model claude-opus-5-5. Reads /api/vwlr/pipeline, feeds, agenda. The hourly bots (x-watch,
      ops-hourly tender_watch) carry the same 🔴 rule between its runs.
    limits: 'No Tender247 API: only public portals and whatever lands in the pipeline table or Gmail. Never submits
      a bid.'
    minimum_output: 'Daily heartbeat or a report with one line per live coal-washing/RCR tender: id, closes, margin,
      eligible?, recommendation — and one line listing everything else.'
    rules:
    - Bid decisions are Aman's click
    - 'No pricing invented: bid calculator inputs must be sourced'
    - Margin first; only coal washing and RCR are analysed; everything else is one line (Aman, chat 2026-10-09)
- id: compliance-sentinel
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py compliance-sentinel
  cadence: daily 07:30 IST
  model: claude-opus-5-5
  checks:
  - compliance_due
  serves: []
  enabled: false   # paused by Aman 2026-10-09 — only levels-alert + capital-watcher run
  charter:
    purpose: No filing, notice or court date surprises Aman.
    thinks: Overdue or ≤3 days = 🔴; 4–14 days = 🟡. Owner is CA Vimal unless a signature is needed, which is Aman's
      click. Stale seed dates are called out.
    works: Daily 07:30 IST. Model claude-opus-5-5. Reads filings, compliance tasks, intel, entities.
    limits: Knows only the filings table and intel. No MCA/GST portal access. Cannot file anything.
    minimum_output: Daily heartbeat or report. Every 🔴 names the entity, the filing, the date, the owner.
    rules:
    - Never file
    - Regulator = Aman's click
    - Entity register is the 20 + 5 Aman confirmed; anything else is UNVERIFIED
- id: capital-watcher
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py capital-watcher
  cadence: hourly 09:00-15:30 IST Mon-Fri
  model: claude-opus-5-5
  checks:
  - acct_positions
  - fo_update
  - mkt_pulse
  serves:
  - capital-rules
  enabled: true
  charter:
    purpose: Watch the four broker accounts and the F&O book for threshold breaches during market hours, and watch
      crude and the major global factors that drive the market (Aman, chat 2026-10-09).
    thinks: '🔴 book >3% day move, position down >5%, expiry ≤2 days unhedged; 🟡 >2% day, unrealised <−5%, sector
      >25%. Patient: never books a loss; a position may be averaged only if there is scope to exit later. Reports;
      never trades.'
    works: 'Hourly 09:05–15:35 IST Mon–Fri. Model claude-opus-5-5. Reads /api/capital/summary via sharecfo, watchlist,
      portfolio news. Watches crude continuously: Brent/WTI, OPEC, inventories, geopolitics, INR.'
    limits: Depends on the sharecfo sessions being logged in (daily OTP is Aman's). Stale sessions are reported
      as stale, never as a number. No fixed P&L targets exist, so none are reported against.
    minimum_output: 'Hourly heartbeat in window. A 🔴 is one line with account, instrument, move, suggested action,
      ETA. Crude-moving news during market hours is reported within the hour, tagged positive/negative for Indian
      equities, with the source piece.'
    rules:
    - Never place or modify an order
    - Stale data is reported as stale
    - Never suggest booking a loss (Aman, chat 2026-10-09)
    - Suggest a trade only at >80% conviction, with the reasoning and the invalidation level (Aman, chat 2026-10-09)
    - Averaging a position is suggested only when a later exit scope is stated (Aman, chat 2026-10-09)
    - 'Crude watch (Brent/WTI, OPEC, inventories, geopolitics, INR) is continuous: crude-moving news in market hours
      is reported within the hour, tagged positive/negative for Indian equities, with the source piece (Aman, chat
      2026-10-09)'
    - No fixed P&L targets (Aman, chat 2026-10-09)
- id: levels-alert
  name: Share buy/sell levels — the whole list, live distance, 🔴 on hit
  runs_on: vps-cron
  provider: none
  command: docker compose exec -T backend python mdo_agent.py levels-alert
  cadence: every 15 min 09:15-15:30 IST Mon-Fri
  model: none
  heartbeat: 'every run: "levels-alert: N shares, M at level, K hits today"; outside 09:15–15:30 IST or on a weekend
    "market closed"'
  checks: []
  serves:
  - capital-rules
  enabled: true
  charter:
    purpose: Aman sees the whole buy/sell list with live distance to each level and is alerted the moment a level
      is hit (Aman, chat 2026-10-09).
    thinks: 'A buy level is hit when ltp ≤ buy_level, a sell level when ltp ≥ sell_level. Every share is listed every
      time, nearest-to-level first, including the ones nowhere near. A hit is recorded in level_hits (UNIQUE ticker +
      side + trading day) so it alerts once per side per day; a share with no price shows "ltp n/a", never a guess.'
    works: 'Every 15 min 09:15–15:30 IST Mon–Fri (cron */15 3-10 UTC; the bot self-checks market hours). No LLM.
      Reads GET /api/levels, fetches prices from Yahoo Finance (mdo_levels.fetch_ltp: batch .NS, .BO fallback,
      LEVELS_PRICE_SOURCE override), POSTs hits + ltps to /api/levels/hits. A NEW hit → 🔴 finding "LEVEL HIT:
      TICKER buy/sell ₹ltp vs ₹level" with the full list as detail (pushed to WhatsApp by /api/agent/report). At
      09:20, 12:30 and 15:05 IST (±8 min) → info finding "Levels snapshot" with the full list. Aman edits the list
      on WhatsApp via the CoS tools set_level / list_levels, or POST/DELETE /api/levels.'
    limits: Does not know NSE holidays (a holiday run sees stale prices and the heartbeat still files). Yahoo
      Finance is free and unauthenticated; when it is blocked every ltp is n/a and the heartbeat says so. Holds no
      broker credential and never touches an order.
    minimum_output: 'Every run in market hours: the heartbeat line with counts. Every new hit: one 🔴 with the entire
      list. Three full-list snapshots a day. Outside market hours: "market closed".'
    rules:
    - Never suggests execution
    - Never books
    - Shows every share every time, including those not yet at their level, both sides (Aman, chat 2026-10-09)
    - Alert once per level per trading day
    - Never invents a price; no price = "ltp n/a"
- id: share-master-daily
  name: Share Master — Portfolio · Mausaji Calls · Levels, one workbook, current every trading day
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_agent.py share-master-daily
  cadence: daily 15:45 IST + daily 08:45 IST
  model: claude-haiku-4-5
  heartbeat: 'every run, also when nothing changed: "share-master: N holdings across A accounts (stale: …) · M Mausaji
    calls (+0 new calls, h hit target, s stopped) · levels L"; when Bantu Mausaji''s chat has nothing new it says
    "+0 new calls" and "no new messages since #id"'
  checks: []
  serves:
  - capital-rules
  enabled: true
  notes: Aman, chat 2026-10-09. Workbook in the vault at finance/Share_Master.xlsx (previous as .prev); the app's
    Share Master card downloads it (/api/share-master/xlsx). Levels seed = data/levels_import_2026-10-09.json via
    tools/import_levels.py; POST /api/levels/import takes further CSV/XLSX rows. HDFC CSV exports go in through
    POST /api/share-master/portfolio/import (holder name + the file) and are the Portfolio fallback until the
    broker session is live again.
  charter:
    purpose: The master share sheet is current every trading day with no clicks — Portfolio from the broker
      holdings, Mausaji Calls from "Bantu Mausaji"'s WhatsApp chat, Levels from Aman's buy/sell list, a Summary
      (Aman, chat 2026-10-09).
    thinks: 'Portfolio: a holding exists only if a broker session (Shares CFO) or an HDFC export Aman uploaded says
      so; a logged-out account keeps its last snapshot and the tab says "HDFC1: session expired, last snapshot
      <date>". Flags CAP >12% weight, L15 / L30 unrealised loss. Mausaji: only explicit calls (stock + buy/sell/
      hold/avoid), prices only when stated, his words quoted ≤300 chars, deduped on message+ticker+action.
      Outcomes from prices only: BUY hit_target when ltp ≥ target, hit_stop when ltp ≤ stop; SELL mirrored; open
      calls expire after 60 days.'
    works: 'Daily 15:45 IST (post-close) and 08:45 IST (pre-open) Mon–Fri (cron 15 10 / 15 3 UTC). Model
      claude-haiku-4-5, used only to parse new Mausaji messages (≤60 per call, from the bot_memory watermark).
      Then POST /api/share-master/refresh: Shares CFO /portfolio per account (HDFC1/2/3 OAuth, ANGEL1 TOTP) or the
      uploaded HDFC CSV as fallback, prices via mdo_levels.fetch_ltp (Yahoo), outcomes, workbook (openpyxl), vault
      save. Heartbeat every run.'
    limits: Holds no broker credential; depends on the Shares CFO sessions Aman logs into daily — a stale account
      is reported stale, never as a number. Yahoo prices may be missing (then "ltp n/a"). Cannot read a chat the
      wa-classifier marked personal (nothing is stored for it). Does not know NSE holidays.
    minimum_output: 'Every run: the heartbeat line with counts, including "no new messages" when the chat is quiet,
      and the vault path when the workbook was saved. A run with no heartbeat is a dead run.'
    rules:
    - Never invents a holding or a call
    - Never suggests execution
    - Every call keeps Mausaji's own words
    - Outcomes computed from prices only
    - Stale data is reported as stale, per account
- id: wa-sweep
  name: WhatsApp sweep — Aman's eyes on Mausaji and the site groups
  runs_on: vps-cron
  provider: none
  command: docker compose exec -T backend python mdo_agent.py wa-sweep ops
  command_mausaji: docker compose exec -T backend python mdo_agent.py wa-sweep mausaji
  command_daily: docker compose exec -T backend python mdo_agent.py wa-sweep daily
  cadence: every 15 min 09:00-15:45 IST Mon-Fri (mausaji) + every 30 min 08:00-22:00 IST (ops) + daily 21:00 IST (daily)
  model: none
  heartbeat: 'every run, even when all zero: "wa-sweep <mode>: C chats swept, N new msgs, F flags (K pushed)"; the
    mausaji run adds the option check ("option NIFTY … ₹x (above 30)" or "option price unavailable")'
  checks: []
  serves:
  - capital-rules
  - vwlr-dispatch
  enabled: true
  objective: Aman's eyes on Mausaji and site groups
  notes: 'Aman, chat 2026-10-09: "be sweeping whatsapp constantly specially during market hours for Bantu Mausaji
    chat for shares, and other washery, siding, hotel groups for project bottlenecks resolving in real time …
    does not involve capital upfront." Answered same day (AMAN_PENDING A13): watched chats = WA_SWEEP_CHATS
    (Bantu Mausaji; Vedanta Daily Report; Washery Civil Update; Ans Management; VWLR Indent Planning; Core
    Group), WA_SWEEP_GROUPS regex as an extra matcher, silence over WA_SWEEP_IDLE_HOURS=1 is intolerable,
    chat priorities later (POST /api/wa/sweep/chats/{jid}/priority). A24: NIFTY 29-Dec-26 25000 CE alert
    below 30 rides in the mausaji run (option_levels, seeded from data/option_levels_import_2026-10-09.json).'
  charter:
    purpose: Every new Mausaji message about a share reaches Aman at once with the price, the list level and
      who holds it; every bottleneck word in a site group reaches him within the half hour; a group that goes
      silent for more than an hour in working hours is flagged (Aman, chat 2026-10-09).
    thinks: 'Rules only, no model. Mausaji: a message is about a share when it names a ticker on the levels
      list, an NSE symbol (cached EQUITY_L.csv) or a company word from the list notes, or carries a call word
      (buy/lelo/entry/target/sl/sell/bech …) with a number. Ops: the bottleneck words (pending, ruka, band,
      breakdown, stuck, nahi aaya, delay, late, shortage, kami, payment, urgent, problem, issue, fail, kharab,
      accident, strike, no diesel, diesel, rake nahi, wagon, demurrage, penalty, complaint, guest complaint,
      cancel). Silence = more than WA_SWEEP_IDLE_HOURS of 08:00–20:00 IST with no message, one flag per episode.'
    works: 'Reads whatsapp_messages/wa_chats (both bridges, WA_WATCH_MODE=all) from a per-chat watermark
      (wa_sweep_state). mausaji: cron */15 3-10 UTC Mon–Fri → one line per message: ticker · Mausaji''s words
      (≤200 chars) · Yahoo price · list level · HELD BY · research only; then the option check in market hours.
      ops: cron */30 2-16 UTC → bottleneck flags pushed at once when that chat had no push in 30 min, else one
      batched message; silence flags pushed at once; the first ops run announces the matched chats. daily: cron
      30 15 UTC → one line with the day''s totals and the chats matched. Flags: /api/wa/sweep/flags, acked on
      the Morning page.'
    limits: Does not read a chat the bridges have not forwarded or that is classified personal (nothing is stored
      for it). Word rules miss paraphrase and catch some noise ("payment received" is a payment flag; the
      regex "ans" also matches "Transport") — Aman corrects the chat set via WA_SWEEP_CHATS / WA_SWEEP_GROUPS.
      Yahoo and NSE prices may be missing ("price n/a" / "option price unavailable"). No LLM, no capital.
    minimum_output: 'Every run: the heartbeat line with counts, including all zeros. Every share message: one
      WhatsApp line. Daily 21:00 IST: the totals line with the chat list.'
    rules:
    - Nothing is an order — every share line ends "research only"
    - Never invents a price, a holder or a chat; "n/a" is said out loud
    - Holder on every share line (Directive 18)
    - No LLM call, ever (Directive 15)
    - Every run reports, especially an empty one (Directive 5)
- id: compliance-reminder
  name: Compliance reminder — statutory dates, Aman hears a week before
  runs_on: vps-cron
  provider: none
  command: docker compose exec -T backend python mdo_agent.py compliance-reminder
  command_weekly: docker compose exec -T backend python mdo_agent.py compliance-reminder weekly
  cadence: daily 08:00 IST + Mon 08:05 IST (weekly)
  model: none
  heartbeat: 'every run, also when nothing is due: "compliance-reminder: N items due in 7 days (K reminders, 1 message
    pushed)" or "compliance-reminder: 0 items due in 7 days, next: <item> on <date>"; "entity list not loaded — group
    level" is appended until the CoS loads compliance_entities; Monday adds "compliance-reminder weekly: N items this
    week (pushed)"'
  checks: []
  serves: []          # Aman's instruction of 2026-10-09 is the mandate; no row on the Objectives sheet yet (CoS comments, never adds)
  enabled: true
  objective: never miss a statutory date; Aman hears a week before
  notes: 'Aman, chat 2026-10-09: "compliance deadline [questions are] unnecessary. the compliance due dates are the
    governmentally fixed dates and i need the reminder at least a week before." The ten questions in
    briefs/COMPLIANCE_CALENDAR_REVIEW.md were withdrawn on that word (AMAN_PENDING A12). Calendar:
    data/compliance_calendar_in.json (India FY2026-27 edition; every row carries its section/rule and the entity kinds
    it binds). Entity list: compliance_entities, EMPTY until the CoS loads names + kinds from the vault registry after
    A15 (POST /api/compliance/entities) — the registry is not in this repo and nothing is invented.'
  charter:
    purpose: Aman hears about every governmentally fixed compliance date at least a week before it, again the day
      before and on the day, in one WhatsApp message a day — without being asked a single question (Aman, chat
      2026-10-09).
    thinks: 'Rules only, no model. The calendar is data: monthly GSTR-1 (11th), GSTR-3B (20th), TDS/TCS deposit
      (7th; March TDS 30 Apr), PF + ESI (15th); quarterly TDS returns 24Q/26Q, advance tax, QRMP; annual ITR
      (31 Jul / 30 Sep audit report / 31 Oct / 30 Nov TP), GSTR-9/9C (31 Dec), DIR-3 KYC (30 Sep), AGM (30 Sep),
      ADT-1 (14 Oct), AOC-4 (29 Oct), MGT-7 (28 Nov), DPT-3 (30 Jun), MSME-1 (30 Apr / 31 Oct), LLP Form 11
      (30 May), LLP Form 8 (30 Oct). A row binds an entity by kind (pvt_ltd, llp, partnership, proprietorship,
      individual) and flags (gst_registered, gst_qrmp, tds_deductor, audit_case, pf_esi). With no entities loaded
      it speaks at group level ("all GST-registered entities"). `extendable: true` rows can move by CBDT/CBIC/MCA
      notification — the bot never assumes an extension and never shifts a date for a holiday. Professional tax
      has no date on purpose: state-specific, [UNVERIFIED], to be confirmed with CA Vimal.'
    works: 'Daily 08:00 IST (cron 30 2 UTC): POST /api/compliance/run mode=daily → everything due in the next 7
      days (inclusive of exactly 7 days before). A push happens when an item reaches a stage today — week (first
      run inside the window), eve (day before), day (due date) — once per (target, item, due date, stage), kept in
      compliance_reminders; the message lists everything due in the 7 days grouped by date, "(payment)" on rows
      that need Aman''s click, footer "Vimal Agrawal & Co (CA) handles filings; your click only for payments".
      Nothing due → nothing pushed, heartbeat "0 items due in 7 days, next: <item> on <date>". Monday 08:05 IST
      (cron 35 2 UTC Mon): mode=weekly → "this week: …" line, pushed even when empty. POST
      /api/compliance/reminders/{id}/done stops later stages for that item. Morning page card "Compliance" shows
      the next 30 days (GET /api/compliance/upcoming?days=30).'
    limits: Knows the statutory rule, not the entity's facts — whether an entity is GST-registered, a TDS deductor,
      an audit case or an employer comes from compliance_entities, which the CoS fills from the vault registry
      (not in this repo). Cannot see MCA/GST/TRACES portals, cannot file, cannot confirm a filing was made. Does
      not know turnover thresholds (GSTR-9 exemption, QRMP eligibility, 44AB) — it reminds, the CA decides.
      Extensions by notification are not tracked; the statutory date stands until Aman or the CA says otherwise.
    minimum_output: 'Every run: the heartbeat line with counts, including "0 items due in 7 days, next: …". Every
      stage reached: one WhatsApp message for the whole 7-day window. Every Monday: the "this week" line, empty or
      not. A run with no heartbeat is a dead run.'
    rules:
    - Never invents an entity, a date or an extension; what it does not know is said as "not loaded" or "[UNVERIFIED]"
    - Never files, never pays — reminders only; payments are Aman's click (Directive 4)
    - One message per day for the whole window, never one per item
    - No LLM call, ever (Directive 15)
    - Every run reports, especially an empty one (Directive 5)
    - No questions to Aman (Aman, chat 2026-10-09)
- id: mail-reader
  name: Mail reader — statements, contract notes and tender results into the vault
  runs_on: vps-cron
  provider: none
  command: docker compose exec -T backend python mdo_agent.py mail-reader
