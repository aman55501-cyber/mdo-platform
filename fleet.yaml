- id: housekeeping
  name: Memory purge + disk health + backups (Directive 12, DEPLOY_HOSTINGER §10)
  runs_on: vps-cron
  command: docker compose exec -T backend python mdo_housekeeping.py
  command_daily: docker compose exec -T backend python mdo_housekeeping.py --daily
  cadence: daily 03:00 IST (snapshots) + weekly Sun 03:00 IST (purge + bundle)
  model: none
  does:
  - 'daily 03:00 IST (--daily): snapshot vega_data.db (+ vedanta_crm.db when present) with the sqlite3 backup
    API to /data/backups/<name>-YYYYMMDD.db.gz, PRAGMA integrity_check each one, keep 14; one line: ''daily: vega
    12.3 MB snapshot ok · 14 kept · disk 71% free''; 🔴 if a snapshot fails or disk <15% free'
  - archive agent_reports older than 60 days to /data/archive/YYYY-MM.jsonl.gz
  - trim whatsapp_messages older than 90 days (group text; photos' extracted text kept 180 days)
  - rotate /var/log/mdo-agent.log, keep 8 weeks
  - VACUUM sqlite; measure free disk; alert at <20% free
  - compact per-chat brain memory older than 30 turns into a dated summary
  - 'weekly: bundle the latest DB snapshots + the vault (memory/, finance/) into ONE encrypted file
    /data/backups/weekly-YYYYMMDD.tar.enc (openssl aes-256-cbc pbkdf2, VAULT_BACKUP_PASSPHRASE), keep 8 locally;
    skipped and said so when no passphrase is set. backup-offsite copies the newest one to Drive via /api/vault/backup/latest'
  never_touches:
  - agenda.yaml
  - COS_LOG.md
  - Objectives sheet
  - open intel_items
  - open ops_tasks
  - checks
  report: 'weekly: ''archived N rows · db X→Y MB · disk Z% free · vega snapshot ok · bundle → weekly-YYYYMMDD.tar.enc''
    · daily: ''daily: vega 12.3 MB snapshot ok · 14 kept · disk 71% free'' — every run, even when nothing was freed'
  serves:
  - all
  enabled: true
  charter:
    purpose: Keep the memory lean and the records safe so the system runs for months with the laptop off.
    thinks: Deterministic. Snapshot, verify, archive, trim, vacuum, bundle, measure. Never judge content.
    works: Daily 03:00 IST (--daily) snapshots every database, verifies, keeps 14. Weekly Sun 03:00 IST archives
      reports >60d, group messages >90d, extractions >180d, compacts chats to the last 20 turns, vacuums, snapshots
      again, bundles snapshots + vault into one AES-256 file, keeps 8, checks disk. No LLM.
    limits: Never touches the Objectives sheet, agenda, COS_LOG.md, open items, bot_memory, the checks registry.
      Never deletes an older snapshot before the new one passed integrity_check. Cannot enlarge the disk. Nothing
      leaves the VPS from here — that is backup-offsite's job.
    minimum_output: 'Every run one line: daily ''vega X MB snapshot ok · 14 kept · disk Y% free''; weekly ''freed X
      MB · disk Y% free · archived N rows · bundle …'', even when zero. Snapshot failed or disk <15% free = 🔴.'
    rules:
    - Archive before delete
    - Verify before prune
    - Report even when nothing was freed
